server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/nadarl-portal;
    index index.html;

    # Don't leak the nginx version in the Server header.
    server_tokens off;

    # --- Security headers (OWASP Secure Headers Project baseline) ---------
    # Restricts scripts to same-origin + the two pinned/SRI'd CDN libraries;
    # Supabase REST/Realtime and the Formspree enquiry form are the only
    # cross-origin network calls the app makes. Update the Supabase host
    # here if the project is ever migrated to a different project ref.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self' https://djjsdzjfutqehgjocwbt.supabase.co wss://djjsdzjfutqehgjocwbt.supabase.co https://formspree.io; form-action 'self' https://formspree.io; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; worker-src 'self'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
    # Strict-Transport-Security is added automatically by `certbot --hsts`
    # (see README "Deployment" > "Enable HTTPS") once the port-443 server
    # block exists - no need to set it here.

    location / {
        try_files $uri $uri/ =404;
    }

    # Prevent this deploy-only directory's git metadata and deploy scripts
    # from being served if nginx's root ever changes.
    location ~ /\. {
        deny all;
    }
    location ^~ /deploy/ {
        deny all;
    }
}
