<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newport & District Air Rifle League - Fixtures</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="../CSS/fixtures.css">
</head>
<body>
    <div class="container">
        <header>
            <a href="../index.html" class="back-link">&larr; Back to Home</a>
            <h1>Newport & District Air Rifle League</h1>
            <p class="subtitle">2026-27 Season Fixtures</p>
        </header>

        <section class="section">
            <h2 class="section-title">Today's Fixtures</h2>
            <div class="today-fixtures" id="todayFixtures">
                <!-- Today's fixtures will be loaded here -->
            </div>
        </section>

        <section class="section">
            <h2 class="section-title">Season Fixtures</h2>
            <table class="fixture-table desktop-fixtures">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Home Team</th>
                        <th>Away Team</th>
                        <th>Venue</th>
                    </tr>
                </thead>
                <tbody id="seasonFixtures">
                </tbody>
            </table>
            <div class="mobile-fixtures" id="mobileSeasonFixtures">
            </div>
        </section>
    </div>

    <script src="../JS/fixtures.js"></script>
</body>
</html>
